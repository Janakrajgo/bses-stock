<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b13" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11192c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a101d" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .title-h2 { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .muted-lbl { font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; }
  </style>

  <rect width="1200" height="560" fill="url(#bgGrad2)" />

  <!-- Section Header -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" class="muted-lbl font-sans" fill="#8b5cf6">AI &amp; PREDICTIVE MODELING BENCHMARK</text>
    <text x="0" y="42" class="title-h2 font-sans" font-size="22">Multi-Model Forecasting Engine &amp; Performance Leaderboard</text>
  </g>

  <!-- Left: Multi-Horizon Forecast Chart -->
  <g transform="translate(24, 80)">
    <rect width="680" height="450" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow2)" />

    <!-- Card Header -->
    <text x="24" y="34" class="title-h2 font-sans" font-size="16">Facebook Prophet Multi-Horizon Projection</text>
    <text x="24" y="52" class="font-sans" font-size="11" fill="#64748b">Historical test series + 30-Day future trajectory with 95% Confidence Interval band</text>

    <!-- Horizon selector buttons -->
    <rect x="420" y="20" width="46" height="22" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="428" y="35" class="font-sans" font-size="10" fill="#94a3b8">7 Days</text>
    <rect x="472" y="20" width="50" height="22" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="480" y="35" class="font-sans" font-size="10" fill="#94a3b8">15 Days</text>
    <rect x="528" y="20" width="52" height="22" rx="4" fill="#8b5cf6" />
    <text x="535" y="35" class="font-sans" font-size="10" font-weight="700" fill="#ffffff">30 Days</text>
    <rect x="586" y="20" width="50" height="22" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="594" y="35" class="font-sans" font-size="10" fill="#94a3b8">90 Days</text>

    <!-- Chart Grid Lines -->
    <line x1="40" y1="100" x2="640" y2="100" stroke="rgba(255,255,255,0.04)" />
    <line x1="40" y1="160" x2="640" y2="160" stroke="rgba(255,255,255,0.04)" />
    <line x1="40" y1="220" x2="640" y2="220" stroke="rgba(255,255,255,0.04)" />
    <line x1="40" y1="280" x2="640" y2="280" stroke="rgba(255,255,255,0.04)" />
    <line x1="40" y1="340" x2="640" y2="340" stroke="rgba(255,255,255,0.04)" />

    <!-- Historical Line (Cyan) -->
    <path d="M 40 290 Q 120 280, 180 250 T 300 230 T 420 180 T 480 200 L 480 200" fill="none" stroke="#06b6d4" stroke-width="2.2" />

    <!-- 95% Confidence Interval Upper/Lower polygon -->
    <polygon points="480,200 520,175 560,150 600,130 640,115 640,245 600,235 560,225 520,215 480,200" fill="url(#bandGrad)" />

    <!-- Upper and Lower dashed bounds -->
    <path d="M 480 200 L 520 175 L 560 150 L 600 130 L 640 115" fill="none" stroke="rgba(167,139,250,0.5)" stroke-width="1.2" stroke-dasharray="3,3" />
    <path d="M 480 200 L 520 215 L 560 225 L 600 235 L 640 245" fill="none" stroke="rgba(167,139,250,0.5)" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Future Mean Prediction Line (yhat - Violet) -->
    <path d="M 480 200 L 520 195 L 560 185 L 600 180 L 640 176" fill="none" stroke="#8b5cf6" stroke-width="2.8" stroke-dasharray="6,4" />

    <!-- Boundary Line Indicator -->
    <line x1="480" y1="80" x2="480" y2="360" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="4,4" />
    <text x="440" y="92" class="font-mono" font-size="9" fill="#fda4af">TEST SPLIT</text>
    <text x="490" y="92" class="font-mono" font-size="9" fill="#c4b5fd">30D FORECAST</text>

    <!-- Legend -->
    <g transform="translate(40, 390)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#06b6d4" stroke-width="2" />
      <text x="26" y="4" class="font-sans" font-size="11" fill="#cbd5e1">Historical</text>

      <line x1="120" y1="0" x2="140" y2="0" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4,3" />
      <text x="146" y="4" class="font-sans" font-size="11" fill="#cbd5e1">Prophet Mean (yhat)</text>

      <rect x="300" y="-6" width="16" height="12" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="0.5" />
      <text x="324" y="4" class="font-sans" font-size="11" fill="#cbd5e1">95% Confidence Band</text>
    </g>
  </g>

  <!-- Right: 4 Benchmark Comparison Charts Grid -->
  <g transform="translate(720, 80)">
    <!-- Metric 1: RMSE -->
    <g transform="translate(0, 0)">
      <rect width="220" height="215" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="16" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">RMSE ↓ <tspan fill="#64748b" font-weight="400">(Lower is better)</tspan></text>
      <!-- Bars -->
      <g transform="translate(16, 40)">
        <text x="0" y="16" class="font-mono" font-size="10" fill="#94a3b8">OLS Reg</text>
        <rect x="65" y="6" width="22" height="12" rx="3" fill="#3b82f6" />
        <text x="94" y="16" class="font-mono" font-size="10" fill="#cbd5e1">₹86</text>

        <text x="0" y="44" class="font-mono" font-size="10" fill="#94a3b8">Prophet</text>
        <rect x="65" y="34" width="45" height="12" rx="3" fill="#8b5cf6" />
        <text x="118" y="44" class="font-mono" font-size="10" font-weight="700" fill="#c4b5fd">₹175</text>

        <text x="0" y="72" class="font-mono" font-size="10" fill="#94a3b8">LSTM</text>
        <rect x="65" y="62" width="56" height="12" rx="3" fill="#06b6d4" />
        <text x="130" y="72" class="font-mono" font-size="10" fill="#67e8f9">₹219</text>

        <text x="0" y="100" class="font-mono" font-size="10" fill="#94a3b8">ARIMA</text>
        <rect x="65" y="90" width="105" height="12" rx="3" fill="#64748b" />
        <text x="178" y="100" class="font-mono" font-size="10" fill="#94a3b8">₹583</text>

        <text x="0" y="128" class="font-mono" font-size="10" fill="#94a3b8">XGBoost</text>
        <rect x="65" y="118" width="125" height="12" rx="3" fill="#f59e0b" />
        <text x="196" y="128" class="font-mono" font-size="10" fill="#fde68a">₹801</text>
      </g>
    </g>

    <!-- Metric 2: MAPE % -->
    <g transform="translate(236, 0)">
      <rect width="220" height="215" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="16" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">MAPE % ↓ <tspan fill="#64748b" font-weight="400">(Price Error)</tspan></text>
      <g transform="translate(16, 40)">
        <text x="0" y="16" class="font-mono" font-size="10" fill="#94a3b8">OLS Reg</text>
        <rect x="65" y="6" width="18" height="12" rx="3" fill="#3b82f6" />
        <text x="90" y="16" class="font-mono" font-size="10" fill="#cbd5e1">1.92%</text>

        <text x="0" y="44" class="font-mono" font-size="10" fill="#94a3b8">Prophet</text>
        <rect x="65" y="34" width="36" height="12" rx="3" fill="#8b5cf6" />
        <text x="110" y="44" class="font-mono" font-size="10" font-weight="700" fill="#34d399">3.95%</text>

        <text x="0" y="72" class="font-mono" font-size="10" fill="#94a3b8">LSTM</text>
        <rect x="65" y="62" width="48" height="12" rx="3" fill="#06b6d4" />
        <text x="122" y="72" class="font-mono" font-size="10" fill="#67e8f9">5.17%</text>

        <text x="0" y="100" class="font-mono" font-size="10" fill="#94a3b8">ARIMA</text>
        <rect x="65" y="90" width="85" height="12" rx="3" fill="#64748b" />
        <text x="158" y="100" class="font-mono" font-size="10" fill="#94a3b8">14.0%</text>

        <text x="0" y="128" class="font-mono" font-size="10" fill="#94a3b8">XGBoost</text>
        <rect x="65" y="118" width="110" height="12" rx="3" fill="#f59e0b" />
        <text x="182" y="128" class="font-mono" font-size="10" fill="#fde68a">18.6%</text>
      </g>
    </g>

    <!-- Metric 3: Directional Accuracy -->
    <g transform="translate(0, 235)">
      <rect width="220" height="215" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="16" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">Directional Hit % ↑</text>
      <g transform="translate(16, 40)">
        <text x="0" y="16" class="font-mono" font-size="10" fill="#94a3b8">XGBoost</text>
        <rect x="65" y="6" width="112" height="12" rx="3" fill="#10b981" />
        <text x="184" y="16" class="font-mono" font-size="10" font-weight="700" fill="#34d399">71.2%</text>

        <text x="0" y="44" class="font-mono" font-size="10" fill="#94a3b8">LSTM</text>
        <rect x="65" y="34" width="98" height="12" rx="3" fill="#06b6d4" />
        <text x="170" y="44" class="font-mono" font-size="10" fill="#67e8f9">62.7%</text>

        <text x="0" y="72" class="font-mono" font-size="10" fill="#94a3b8">Prophet</text>
        <rect x="65" y="62" width="92" height="12" rx="3" fill="#8b5cf6" />
        <text x="165" y="72" class="font-mono" font-size="10" fill="#c4b5fd">59.3%</text>

        <text x="0" y="100" class="font-mono" font-size="10" fill="#94a3b8">ARIMA</text>
        <rect x="65" y="90" width="92" height="12" rx="3" fill="#64748b" />
        <text x="165" y="100" class="font-mono" font-size="10" fill="#94a3b8">59.3%</text>

        <text x="0" y="128" class="font-mono" font-size="10" fill="#94a3b8">Baseline</text>
        <line x1="65" y1="124" x2="143" y2="124" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" />
        <text x="150" y="128" class="font-mono" font-size="10" fill="#fda4af">50.0%</text>
      </g>
    </g>

    <!-- Metric 4: R² Score -->
    <g transform="translate(236, 235)">
      <rect width="220" height="215" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="16" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">R² Fit Quality ↑</text>
      <g transform="translate(16, 40)">
        <text x="0" y="16" class="font-mono" font-size="10" fill="#94a3b8">Prophet</text>
        <rect x="65" y="6" width="115" height="12" rx="3" fill="#8b5cf6" />
        <text x="186" y="16" class="font-mono" font-size="10" font-weight="700" fill="#c4b5fd">0.968</text>

        <text x="0" y="44" class="font-mono" font-size="10" fill="#94a3b8">OLS Reg</text>
        <rect x="65" y="34" width="112" height="12" rx="3" fill="#3b82f6" />
        <text x="184" y="44" class="font-mono" font-size="10" fill="#93c5fd">0.956</text>

        <text x="0" y="72" class="font-mono" font-size="10" fill="#94a3b8">LSTM</text>
        <rect x="65" y="62" width="110" height="12" rx="3" fill="#06b6d4" />
        <text x="182" y="72" class="font-mono" font-size="10" fill="#67e8f9">0.951</text>

        <text x="0" y="100" class="font-mono" font-size="10" fill="#94a3b8">XGBoost</text>
        <rect x="65" y="90" width="102" height="12" rx="3" fill="#f59e0b" />
        <text x="174" y="100" class="font-mono" font-size="10" fill="#fde68a">0.884</text>

        <text x="0" y="128" class="font-mono" font-size="10" fill="#94a3b8">ARIMA</text>
        <rect x="65" y="118" width="95" height="12" rx="3" fill="#64748b" />
        <text x="168" y="128" class="font-mono" font-size="10" fill="#94a3b8">0.824</text>
      </g>
    </g>
  </g>
</svg>
