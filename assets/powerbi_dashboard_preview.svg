    <text x="0" y="42" class="font-sans" font-size="22" font-weight="700" fill="#ffffff">Executive Business Intelligence &amp; Slicers Matrix</text>
  </g>

  <!-- Slicers Bar -->
  <g transform="translate(24, 80)">
    <rect width="1152" height="54" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <text x="20" y="32" class="font-sans" font-size="11" font-weight="700" fill="#64748b">FISCAL YEAR SLICER:</text>
    <rect x="150" y="14" width="70" height="26" rx="5" fill="#8b5cf6" />
    <text x="162" y="31" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">ALL (10Y)</text>

    <rect x="228" y="14" width="65" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="238" y="31" class="font-sans" font-size="11" fill="#94a3b8">FY26-27</text>

    <rect x="300" y="14" width="65" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="310" y="31" class="font-sans" font-size="11" fill="#94a3b8">FY25-26</text>

    <rect x="372" y="14" width="65" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="382" y="31" class="font-sans" font-size="11" fill="#94a3b8">FY24-25</text>

    <line x1="456" y1="14" x2="456" y2="40" stroke="rgba(255,255,255,0.1)" />

    <text x="475" y="32" class="font-sans" font-size="11" font-weight="700" fill="#64748b">QUARTER SLICER:</text>
    <rect x="585" y="14" width="45" height="26" rx="5" fill="#8b5cf6" />
    <text x="596" y="31" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">ALL</text>

    <rect x="638" y="14" width="40" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="648" y="31" class="font-sans" font-size="11" fill="#94a3b8">Q1</text>

    <rect x="686" y="14" width="40" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="696" y="31" class="font-sans" font-size="11" fill="#94a3b8">Q2</text>

    <rect x="734" y="14" width="40" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="744" y="31" class="font-sans" font-size="11" fill="#94a3b8">Q3</text>

    <rect x="782" y="14" width="40" height="26" rx="5" fill="rgba(255,255,255,0.05)" />
    <text x="792" y="31" class="font-sans" font-size="11" fill="#94a3b8">Q4</text>

    <!-- Right DAX active badge -->
    <rect x="990" y="14" width="144" height="26" rx="13" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="0.8" />
    <text x="1006" y="31" class="font-sans" font-size="11" font-weight="700" fill="#fde68a">⚡ DAX Engine Active</text>
  </g>

  <!-- 6 Power BI DAX Cards -->
  <g transform="translate(24, 150)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="10" fill="#94a3b8">[Close Price]</text>
    <text x="14" y="52" class="font-mono" font-size="20" font-weight="700" fill="#ffffff">₹3,872.10</text>
