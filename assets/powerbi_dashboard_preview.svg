    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <rect width="1200" height="520" fill="url(#bgGrad3)" />

  <!-- Section Header -->
  <g transform="translate(24, 24)">
