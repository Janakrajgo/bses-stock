    <rect x="195" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="209" y="22" class="font-mono" font-size="10" fill="#94a3b8">[Price YoY %]</text>
    <text x="209" y="52" class="font-mono" font-size="20" font-weight="700" fill="#34d399">+74.8%</text>
    <text x="209" y="70" class="font-sans" font-size="10" fill="#64748b">SAMEPERIODLASTYEAR</text>

    <!-- Card 3 -->
    <rect x="390" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="404" y="22" class="font-mono" font-size="10" fill="#94a3b8">[30D Volatility]</text>
    <text x="404" y="52" class="font-mono" font-size="20" font-weight="700" fill="#38bdf8">22.4%</text>
    <text x="404" y="70" class="font-sans" font-size="10" fill="#64748b">Annualized STDEV</text>

    <!-- Card 4 -->
    <rect x="585" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="599" y="22" class="font-mono" font-size="10" fill="#94a3b8">[Sharpe Ratio]</text>
    <text x="599" y="52" class="font-mono" font-size="20" font-weight="700" fill="#a78bfa">1.84</text>
    <text x="599" y="70" class="font-sans" font-size="10" fill="#64748b">Indian Repo Rf=6.5%</text>

    <!-- Card 5 -->
    <rect x="780" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="794" y="22" class="font-mono" font-size="10" fill="#94a3b8">[Max Drawdown]</text>
    <text x="794" y="52" class="font-mono" font-size="20" font-weight="700" fill="#f43f5e">-44.6%</text>
    <text x="794" y="70" class="font-sans" font-size="10" fill="#64748b">March 2020 COVID</text>

    <!-- Card 6 -->
    <rect x="975" y="0" width="176" height="88" rx="10" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="989" y="22" class="font-mono" font-size="10" fill="#94a3b8">[Flagged Anomalies]</text>
    <text x="989" y="52" class="font-mono" font-size="20" font-weight="700" fill="#f59e0b">300 Days</text>
    <text x="989" y="70" class="font-sans" font-size="10" fill="#64748b">Z-Score &gt; 3.0σ Outliers</text>
  </g>

  <!-- Bottom Visual: Filtered Context Chart & Measures Preview -->
  <g transform="translate(24, 254)">
    <rect width="1152" height="240" rx="12" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Left: Filtered Multi-Year Price Curve -->
    <g transform="translate(24, 20)">
      <text x="0" y="16" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Dynamic DAX Measure: [Selected Dynamic Metric] (₹)</text>
      <text x="0" y="34" class="font-sans" font-size="11" fill="#64748b">Responding live to active Fiscal Year and Quarter filter context</text>

      <!-- Curve -->
      <path d="M 0 160 Q 140 140, 240 130 T 400 90 T 520 120 T 640 40 L 640 170 L 0 170 Z" fill="rgba(139,92,246,0.15)" />
      <path d="M 0 160 Q 140 140, 240 130 T 400 90 T 520 120 T 640 40" fill="none" stroke="#8b5cf6" stroke-width="2.5" />

      <line x1="0" y1="170" x2="640" y2="170" stroke="rgba(255,255,255,0.1)" />
      <text x="0" y="186" class="font-mono" font-size="9" fill="#64748b">2017</text>
      <text x="160" y="186" class="font-mono" font-size="9" fill="#64748b">2019</text>
      <text x="320" y="186" class="font-mono" font-size="9" fill="#64748b">2021</text>
      <text x="480" y="186" class="font-mono" font-size="9" fill="#64748b">2023</text>
      <text x="610" y="186" class="font-mono" font-size="9" fill="#a78bfa">2026</text>
    </g>

    <!-- Right: DAX Code Snippet Preview -->
    <g transform="translate(700, 20)">
      <rect width="428" height="190" rx="8" fill="#05080f" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="16" y="24" class="font-mono" font-size="11" font-weight="700" fill="#fde68a">// [Sharpe Ratio (Rf = 6.5% Repo)]</text>
      <text x="16" y="44" class="font-mono" font-size="11" fill="#93c5fd">Sharpe Ratio = </text>
      <text x="16" y="64" class="font-mono" font-size="11" fill="#c4b5fd">VAR RiskFreeRateDaily = 0.065 / 252</text>
      <text x="16" y="84" class="font-mono" font-size="11" fill="#c4b5fd">VAR AvgDailyReturn = AVERAGE('BSE'[Daily_Return_Pct])</text>
      <text x="16" y="104" class="font-mono" font-size="11" fill="#c4b5fd">VAR DailyStd = STDEV.S('BSE'[Daily_Return_Pct])</text>
      <text x="16" y="124" class="font-mono" font-size="11" fill="#93c5fd">RETURN</text>
      <text x="16" y="144" class="font-mono" font-size="11" fill="#34d399">    DIVIDE((AvgDailyReturn - RiskFreeRateDaily) * SQRT(252),</text>
      <text x="16" y="164" class="font-mono" font-size="11" fill="#34d399">           DailyStd * SQRT(252), 0)</text>
    </g>
  </g>
</svg>
