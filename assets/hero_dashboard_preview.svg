<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b13" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121b2f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="volFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters & Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .label { font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .title { font-size: 18px; fill: #ffffff; font-weight: 700; }
    .metric-val { font-size: 26px; font-weight: 800; fill: #ffffff; }
    .pill { rx: 6px; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="100" r="180" fill="#8b5cf6" opacity="0.08" />
  <circle cx="1050" cy="200" r="220" fill="#06b6d4" opacity="0.06" />

  <!-- ================= TOP HEADER RIBBON ================= -->
  <rect x="0" y="0" width="1200" height="64" fill="#0c1322" fill-opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Logo & Title -->
  <rect x="24" y="14" width="36" height="36" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="34" y="38" font-size="20">📈</text>
  <text x="70" y="34" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">BSE <tspan fill="url(#violetCyan)">MarketPulse</tspan></text>
  <text x="70" y="49" class="font-sans" font-size="10" fill="#94a3b8">Enterprise Stock Analysis &amp; ML Forecasting Terminal</text>

  <!-- Ticker Badge -->
  <rect x="420" y="18" width="140" height="28" rx="6" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
  <circle cx="432" cy="32" r="3" fill="#10b981" />
  <text x="442" y="36" class="font-mono" font-size="11" font-weight="700" fill="#c4b5fd">RELIANCE.NS</text>

  <!-- Quick Metrics -->
  <text x="600" y="27" class="label font-sans">LAST CLOSE</text>
  <text x="600" y="44" class="font-mono" font-size="14" font-weight="700" fill="#ffffff">₹3,872.10</text>

  <text x="710" y="27" class="label font-sans">24H CHANGE</text>
  <text x="710" y="44" class="font-mono" font-size="14" font-weight="700" fill="#fb7185">▼ ₹14.50 (-0.37%)</text>

  <text x="860" y="27" class="label font-sans">52W HIGH / LOW</text>
  <text x="860" y="44" class="font-mono" font-size="13" font-weight="600" fill="#cbd5e1">₹4,446.8 / ₹2,021.5</text>

  <text x="1030" y="27" class="label font-sans">10-YR CAGR</text>
  <text x="1030" y="44" class="font-mono" font-size="14" font-weight="700" fill="#34d399">+44.9% p.a.</text>

  <!-- ================= TOP KPI CARDS STRIP ================= -->
  <!-- Card 1: Best Price Accuracy -->
  <g transform="translate(24, 80)">
    <rect width="216" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(139,92,246,0.3)" stroke-width="1" filter="url(#cardShadow)" />
    <rect width="216" height="3" rx="1.5" fill="#8b5cf6" />
    <text x="16" y="24" class="label font-sans">BEST PRICE ACCURACY</text>
    <rect x="145" y="12" width="56" height="18" rx="9" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="0.5" />
    <text x="153" y="25" class="font-sans" font-size="9" font-weight="700" fill="#c4b5fd">Prophet</text>
    <text x="16" y="58" class="metric-val font-mono" fill="#a78bfa">3.95%</text>
    <text x="16" y="74" class="font-sans" font-size="11" fill="#94a3b8">MAPE Validation Error</text>
    <text x="16" y="87" class="font-mono" font-size="9" fill="#64748b">RMSE: ₹175.13 · 95% CI</text>
  </g>

  <!-- Card 2: Directional Hit Rate -->
  <g transform="translate(260, 80)">
    <rect width="216" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.3)" stroke-width="1" filter="url(#cardShadow)" />
    <rect width="216" height="3" rx="1.5" fill="#10b981" />
    <text x="16" y="24" class="label font-sans">BEST DIRECTION</text>
    <rect x="140" y="12" width="60" height="18" rx="9" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="0.5" />
    <text x="147" y="25" class="font-sans" font-size="9" font-weight="700" fill="#6ee7b7">XGBoost</text>
    <text x="16" y="58" class="metric-val font-mono" fill="#34d399">71.19%</text>
    <text x="16" y="74" class="font-sans" font-size="11" fill="#94a3b8">Directional Hit Rate</text>
    <text x="16" y="87" class="font-mono" font-size="9" fill="#64748b">+21.2% over Random 50%</text>
  </g>

  <!-- Card 3: Deep Learning All-Rounder -->
  <g transform="translate(496, 80)">
    <rect width="216" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(6,182,212,0.3)" stroke-width="1" filter="url(#cardShadow)" />
    <rect width="216" height="3" rx="1.5" fill="#06b6d4" />
    <text x="16" y="24" class="label font-sans">DEEP LEARNING</text>
    <rect x="155" y="12" width="46" height="18" rx="9" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="0.5" />
    <text x="163" y="25" class="font-sans" font-size="9" font-weight="700" fill="#67e8f9">LSTM</text>
    <text x="16" y="58" class="metric-val font-mono" fill="#38bdf8">5.17%</text>
    <text x="16" y="74" class="font-sans" font-size="11" fill="#94a3b8">Recurrent Sequential MAPE</text>
    <text x="16" y="87" class="font-mono" font-size="9" fill="#64748b">RMSE: ₹219.24 · 20D Memory</text>
  </g>

  <!-- Card 4: Regression Benchmark -->
  <g transform="translate(732, 80)">
    <rect width="216" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="1" filter="url(#cardShadow)" />
    <rect width="216" height="3" rx="1.5" fill="#f59e0b" />
    <text x="16" y="24" class="label font-sans">REGRESSION OLS</text>
    <rect x="150" y="12" width="50" height="18" rx="9" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.5" />
    <text x="158" y="25" class="font-sans" font-size="9" font-weight="700" fill="#fde68a">Linear</text>
    <text x="16" y="58" class="metric-val font-mono" fill="#fbbf24">1.92%</text>
    <text x="16" y="74" class="font-sans" font-size="11" fill="#94a3b8">Holdout Test MAPE</text>
    <text x="16" y="87" class="font-mono" font-size="9" fill="#64748b">R²: 0.9562 · OLS Trendline</text>
  </g>

  <!-- Card 5: Power BI Suite -->
  <g transform="translate(968, 80)">
    <rect width="208" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(244,63,94,0.3)" stroke-width="1" filter="url(#cardShadow)" />
    <rect width="208" height="3" rx="1.5" fill="#f43f5e" />
    <text x="16" y="24" class="label font-sans">POWER BI &amp; DAX</text>
    <rect x="135" y="12" width="58" height="18" rx="9" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="0.5" />
    <text x="142" y="25" class="font-sans" font-size="9" font-weight="700" fill="#fda4af">25+ DAX</text>
    <text x="16" y="58" class="metric-val font-mono" fill="#f43f5e">2,318</text>
    <text x="16" y="74" class="font-sans" font-size="11" fill="#94a3b8">Cleaned BSE Days</text>
    <text x="16" y="87" class="font-mono" font-size="9" fill="#64748b">Star-Schema Model Ready</text>
  </g>

  <!-- ================= MAIN CHART CONTAINER ================= -->
  <g transform="translate(24, 192)">
    <rect width="1152" height="464" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)" />

    <!-- Chart Toolbar -->
    <text x="24" y="36" class="title font-sans">Reliance Industries (BSE / NSE) — Historical Stock Price Action</text>
    <text x="24" y="54" class="font-sans" font-size="12" fill="#64748b">Displaying 1 Year OHLCV with SMA 20, SMA 50, Bollinger Bands &amp; Volume Profile</text>

    <!-- Period Buttons -->
    <rect x="760" y="22" width="36" height="24" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="770" y="38" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">1W</text>
    <rect x="802" y="22" width="36" height="24" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="812" y="38" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">1M</text>
    <rect x="844" y="22" width="36" height="24" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="854" y="38" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">6M</text>
    <rect x="886" y="22" width="36" height="24" rx="4" fill="#8b5cf6" />
    <text x="897" y="38" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">1Y</text>
    <rect x="928" y="22" width="36" height="24" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="938" y="38" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">3Y</text>
    <rect x="970" y="22" width="40" height="24" rx="4" fill="rgba(255,255,255,0.05)" />
    <text x="978" y="38" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">ALL</text>

    <!-- Indicators legend pills -->
    <rect x="680" y="60" width="80" height="20" rx="10" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="0.5" />
    <circle cx="692" cy="70" r="3" fill="#38bdf8" />
    <text x="700" y="74" class="font-sans" font-size="10" font-weight="600" fill="#7dd3fc">SMA 20</text>

    <rect x="770" y="60" width="80" height="20" rx="10" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="0.5" />
    <circle cx="782" cy="70" r="3" fill="#f59e0b" />
    <text x="790" y="74" class="font-sans" font-size="10" font-weight="600" fill="#fde68a">SMA 50</text>

    <rect x="860" y="60" width="100" height="20" rx="10" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="0.5" />
    <circle cx="872" cy="70" r="3" fill="#a78bfa" />
    <text x="880" y="74" class="font-sans" font-size="10" font-weight="600" fill="#c4b5fd">Bollinger</text>

    <rect x="970" y="60" width="80" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.5" />
    <circle cx="982" cy="70" r="3" fill="#10b981" />
    <text x="990" y="74" class="font-sans" font-size="10" font-weight="600" fill="#6ee7b7">Volume</text>

    <!-- Chart Grid Lines -->
    <line x1="60" y1="120" x2="1080" y2="120" stroke="rgba(255,255,255,0.05)" />
    <text x="1090" y="124" class="font-mono" font-size="10" fill="#64748b">₹4,400</text>

    <line x1="60" y1="180" x2="1080" y2="180" stroke="rgba(255,255,255,0.05)" />
    <text x="1090" y="184" class="font-mono" font-size="10" fill="#64748b">₹4,000</text>

    <line x1="60" y1="240" x2="1080" y2="240" stroke="rgba(255,255,255,0.05)" />
    <text x="1090" y="244" class="font-mono" font-size="10" fill="#64748b">₹3,600</text>

    <line x1="60" y1="300" x2="1080" y2="300" stroke="rgba(255,255,255,0.05)" />
    <text x="1090" y="304" class="font-mono" font-size="10" fill="#64748b">₹3,200</text>

    <line x1="60" y1="360" x2="1080" y2="360" stroke="rgba(255,255,255,0.05)" />
    <text x="1090" y="364" class="font-mono" font-size="10" fill="#64748b">₹2,800</text>

    <!-- Volume Bars at Bottom -->
    <g transform="translate(60, 360)">
      <rect x="20" y="10" width="12" height="24" fill="url(#volFill)" />
      <rect x="40" y="4" width="12" height="30" fill="url(#volFill)" />
      <rect x="60" y="14" width="12" height="20" fill="url(#volFill)" />
      <rect x="80" y="0" width="12" height="34" fill="url(#volFill)" />
      <rect x="100" y="8" width="12" height="26" fill="url(#volFill)" />
      <rect x="130" y="15" width="12" height="19" fill="url(#volFill)" />
      <rect x="160" y="2" width="12" height="32" fill="url(#volFill)" />
      <rect x="190" y="12" width="12" height="22" fill="url(#volFill)" />
      <rect x="220" y="18" width="12" height="16" fill="url(#volFill)" />
      <rect x="250" y="5" width="12" height="29" fill="url(#volFill)" />
      <rect x="280" y="9" width="12" height="25" fill="url(#volFill)" />
      <rect x="310" y="14" width="12" height="20" fill="url(#volFill)" />
      <rect x="340" y="2" width="12" height="32" fill="url(#volFill)" />
      <rect x="380" y="8" width="12" height="26" fill="url(#volFill)" />
      <rect x="420" y="1" width="12" height="33" fill="url(#volFill)" />
      <rect x="460" y="11" width="12" height="23" fill="url(#volFill)" />
      <rect x="500" y="6" width="12" height="28" fill="url(#volFill)" />
      <rect x="540" y="16" width="12" height="18" fill="url(#volFill)" />
      <rect x="580" y="3" width="12" height="31" fill="url(#volFill)" />
      <rect x="620" y="12" width="12" height="22" fill="url(#volFill)" />
      <rect x="660" y="7" width="12" height="27" fill="url(#volFill)" />
      <rect x="700" y="15" width="12" height="19" fill="url(#volFill)" />
      <rect x="740" y="0" width="12" height="34" fill="url(#volFill)" />
      <rect x="780" y="9" width="12" height="25" fill="url(#volFill)" />
      <rect x="820" y="14" width="12" height="20" fill="url(#volFill)" />
      <rect x="860" y="4" width="12" height="30" fill="url(#volFill)" />
      <rect x="900" y="11" width="12" height="23" fill="url(#volFill)" />
      <rect x="940" y="2" width="12" height="32" fill="url(#volFill)" />
      <rect x="980" y="8" width="12" height="26" fill="url(#volFill)" />
    </g>

    <!-- Bollinger Bands Area -->
    <path d="M 60 340 Q 200 310, 320 280 T 560 210 T 780 140 T 960 170 L 1040 190 L 1040 240 Q 960 220, 780 190 T 560 260 T 320 330 T 60 380 Z" fill="rgba(167,139,250,0.06)" />

    <!-- Price Area Fill -->
    <path d="M 60 360 Q 200 330, 320 300 T 560 230 T 780 150 T 960 180 L 1040 205 L 1040 400 L 60 400 Z" fill="url(#areaFill)" />

    <!-- Price Line (Violet) -->
    <path d="M 60 360 Q 200 330, 320 300 T 560 230 T 780 150 T 960 180 L 1040 205" fill="none" stroke="#8b5cf6" stroke-width="2.5" />

    <!-- SMA 20 (Cyan Line) -->
    <path d="M 60 368 Q 200 336, 320 308 T 560 238 T 780 160 T 960 186 L 1040 210" fill="none" stroke="#38bdf8" stroke-width="1.8" />

    <!-- SMA 50 (Amber Line) -->
    <path d="M 60 376 Q 200 345, 320 320 T 560 252 T 780 178 T 960 196 L 1040 218" fill="none" stroke="#f59e0b" stroke-width="1.8" />

    <!-- Active Hover Pulse Pin at latest point -->
    <circle cx="1040" cy="205" r="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#glowViolet)" />

    <!-- Floating HUD Card on point -->
    <g transform="translate(870, 105)">
      <rect width="180" height="74" rx="8" fill="#0d1424" stroke="rgba(139,92,246,0.5)" stroke-width="1" filter="url(#cardShadow)" />
      <text x="14" y="20" class="font-mono" font-size="11" fill="#cbd5e1">2026-06-25</text>
      <text x="14" y="42" class="font-mono" font-size="16" font-weight="700" fill="#a78bfa">₹3,872.10</text>
      <text x="14" y="60" class="font-mono" font-size="10" fill="#34d399">SMA20: ₹3,982 · Vol: 2.8M</text>
    </g>

    <!-- X Axis Dates -->
    <text x="60" y="424" class="font-mono" font-size="10" fill="#64748b">JUL 2025</text>
    <text x="240" y="424" class="font-mono" font-size="10" fill="#64748b">SEP 2025</text>
    <text x="440" y="424" class="font-mono" font-size="10" fill="#64748b">NOV 2025</text>
    <text x="640" y="424" class="font-mono" font-size="10" fill="#64748b">JAN 2026</text>
    <text x="840" y="424" class="font-mono" font-size="10" fill="#64748b">MAR 2026</text>
    <text x="1010" y="424" class="font-mono" font-size="10" fill="#a78bfa">JUN 2026</text>
  </g>
</svg>
